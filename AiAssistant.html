<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base target="_top">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: #f5f5f5;
    }

    /* Header */
    .header {
      background: #2E5339;
      color: #fff;
      padding: 12px 16px;
      text-align: center;
      flex-shrink: 0;
    }
    .header h2 { font-size: 15px; margin: 0; letter-spacing: 0.5px; }
    .header .sub { font-size: 10px; color: #8cc99e; margin-top: 2px; }

    /* Messages area */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }
    .msg {
      margin-bottom: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.5;
      word-wrap: break-word;
      max-width: 95%;
    }
    .msg-user {
      background: #2E5339;
      color: #fff;
      margin-left: auto;
      border-bottom-right-radius: 4px;
      text-align: right;
    }
    .msg-ai {
      background: #fff;
      color: #333;
      border: 1px solid #e0e0e0;
      border-bottom-left-radius: 4px;
      white-space: pre-wrap;
    }
    .msg-error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
      font-size: 12px;
    }
    .msg-system {
      background: #e8f5e9;
      color: #2E5339;
      text-align: center;
      font-size: 11px;
      font-style: italic;
    }

    /* Loading dots */
    .loading { display: flex; gap: 4px; padding: 10px 12px; }
    .loading .dot {
      width: 8px;
      height: 8px;
      background: #2E5339;
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
    }
    .loading .dot:nth-child(1) { animation-delay: -0.32s; }
    .loading .dot:nth-child(2) { animation-delay: -0.16s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    /* Input area */
    .input-area {
      padding: 10px 12px;
      background: #fff;
      border-top: 1px solid #e0e0e0;
      flex-shrink: 0;
    }
    .input-row { display: flex; gap: 6px; }
    .input-row textarea {
      flex: 1;
      padding: 10px;
      font-size: 13px;
      font-family: Arial, sans-serif;
      border: 2px solid #ddd;
      border-radius: 8px;
      resize: none;
      min-height: 40px;
      max-height: 80px;
    }
    .input-row textarea:focus {
      outline: none;
      border-color: #2E5339;
      box-shadow: 0 0 0 2px rgba(46,83,57,0.2);
    }
    .send-btn {
      padding: 10px 16px;
      background: #2E5339;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      align-self: flex-end;
      min-height: 44px;
      min-width: 44px;
    }
    .send-btn:hover { background: #3a6249; }
    .send-btn:disabled { background: #ccc; cursor: not-allowed; }

    /* Suggested questions */
    .suggestions {
      padding: 8px 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .suggestion {
      padding: 6px 10px;
      font-size: 11px;
      background: #e8f5e9;
      color: #2E5339;
      border: 1px solid #c8e6c9;
      border-radius: 16px;
      cursor: pointer;
      white-space: nowrap;
    }
    .suggestion:hover { background: #c8e6c9; }

    /* Footer */
    .footer {
      text-align: center;
      font-size: 9px;
      color: #aaa;
      padding: 4px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <div class="header">
    <h2>AI Assistant</h2>
    <div class="sub">Ask questions about your order data</div>
  </div>

  <div class="messages" id="messages">
    <div class="msg msg-system">
      Ask me anything about orders, samples, shipments, or customers.
      I can only read data — I cannot make changes.
    </div>
    <div class="suggestions" id="suggestions">
      <span class="suggestion" onclick="askSuggestion(this)">How many orders are pending?</span>
      <span class="suggestion" onclick="askSuggestion(this)">What shipped today?</span>
      <span class="suggestion" onclick="askSuggestion(this)">Show orders from Volcafe</span>
      <span class="suggestion" onclick="askSuggestion(this)">Which warehouses have live orders?</span>
    </div>
  </div>

  <div class="input-area">
    <div class="input-row">
      <textarea id="questionInput" placeholder="Ask a question..."
                rows="1" onkeydown="handleKey(event)"></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendQuestion()">Ask</button>
    </div>
  </div>

  <div class="footer">Read-only &bull; Powered by Claude</div>

<script>
  var busy = false;

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendQuestion();
    }
  }

  function askSuggestion(el) {
    document.getElementById('questionInput').value = el.textContent;
    sendQuestion();
  }

  function sendQuestion() {
    var input = document.getElementById('questionInput');
    var question = input.value.trim();
    if (!question || busy) return;

    busy = true;
    document.getElementById('sendBtn').disabled = true;

    // Hide suggestions after first question
    var sug = document.getElementById('suggestions');
    if (sug) sug.style.display = 'none';

    // Add user message
    addMessage(question, 'user');
    input.value = '';

    // Show loading indicator
    var loadingId = showLoading();

    google.script.run
      .withSuccessHandler(function(result) {
        removeLoading(loadingId);
        if (result.success) {
          addMessage(result.message, 'ai');
        } else {
          addMessage(result.message, 'error');
        }
        busy = false;
        document.getElementById('sendBtn').disabled = false;
        input.focus();
      })
      .withFailureHandler(function(err) {
        removeLoading(loadingId);
        addMessage('Connection error: ' + err.message, 'error');
        busy = false;
        document.getElementById('sendBtn').disabled = false;
        input.focus();
      })
      .askAiAssistant(question);
  }

  function addMessage(text, type) {
    var container = document.getElementById('messages');
    var div = document.createElement('div');
    div.className = 'msg msg-' + type;

    if (type === 'ai') {
      // Escape HTML first, then preserve line breaks and bullets
      div.innerHTML = escapeHtml(text)
        .replace(/\n/g, '<br>');
    } else {
      div.textContent = text;
    }

    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
  }

  function showLoading() {
    var container = document.getElementById('messages');
    var div = document.createElement('div');
    var id = 'loading-' + Date.now();
    div.id = id;
    div.className = 'loading';
    div.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
    return id;
  }

  function removeLoading(id) {
    var el = document.getElementById(id);
    if (el) el.remove();
  }

  function escapeHtml(text) {
    var div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  // Auto-focus input
  document.getElementById('questionInput').focus();
</script>
</body>
</html>
