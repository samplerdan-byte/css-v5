<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base target="_top">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: #f5f5f5;
      font-size: 14px;
    }

    /* Header */
    .header {
      background: #2E5339;
      color: #fff;
      padding: 12px 16px;
      text-align: center;
      flex-shrink: 0;
    }
    .header h2 { font-size: 16px; margin: 0; letter-spacing: 0.5px; }
    .header .sub { font-size: 12px; color: #8cc99e; margin-top: 2px; }

    /* Messages area */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }
    .msg {
      margin-bottom: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.5;
      word-wrap: break-word;
      max-width: 95%;
    }
    .msg-user {
      background: #2E5339;
      color: #fff;
      margin-left: auto;
      border-bottom-right-radius: 4px;
      text-align: right;
    }
    .msg-ai {
      background: #fff;
      color: #333;
      border: 1px solid #e0e0e0;
      border-bottom-left-radius: 4px;
      white-space: pre-wrap;
    }
    .msg-error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
      border-left: 4px solid #dc3545;
      font-size: 14px;
    }
    .msg-system {
      background: #e8f5e9;
      color: #2E5339;
      text-align: center;
      font-size: 13px;
      font-style: italic;
    }

    /* Loading dots */
    .loading { display: flex; gap: 4px; padding: 10px 12px; }
    .loading .dot {
      width: 10px;
      height: 10px;
      background: #2E5339;
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
    }
    .loading .dot:nth-child(1) { animation-delay: -0.32s; }
    .loading .dot:nth-child(2) { animation-delay: -0.16s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    /* Input area */
    .input-area {
      padding: 10px 12px;
      background: #fff;
      border-top: 1px solid #e0e0e0;
      flex-shrink: 0;
    }
    .input-row { display: flex; gap: 6px; align-items: flex-end; }
    .input-row textarea {
      flex: 1;
      padding: 12px;
      font-size: 14px;
      font-family: Arial, sans-serif;
      border: 2px solid #ddd;
      border-radius: 8px;
      resize: none;
      min-height: 48px;
      max-height: 120px;
    }
    .input-row textarea:focus {
      outline: none;
      border-color: #2E5339;
      box-shadow: 0 0 0 3px rgba(46,83,57,0.25);
    }
    .send-btn {
      padding: 12px 18px;
      background: #2E5339;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
      align-self: flex-end;
      min-height: 48px;
      min-width: 60px;
    }
    .send-btn:hover { background: #3a6249; }
    .send-btn:disabled { background: #999; cursor: not-allowed; }
    .send-btn:focus { outline: 3px solid #ffbf00; outline-offset: 2px; }

    /* Suggested questions */
    .suggestions {
      padding: 8px 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .suggestion {
      padding: 10px 14px;
      font-size: 13px;
      background: #e8f5e9;
      color: #2E5339;
      border: 1px solid #c8e6c9;
      border-radius: 20px;
      cursor: pointer;
      white-space: nowrap;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
    }
    .suggestion:hover { background: #c8e6c9; }
    .suggestion:focus { outline: 2px solid #2E5339; outline-offset: 2px; }

    /* Footer */
    .footer {
      text-align: center;
      font-size: 11px;
      color: #888;
      padding: 6px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <div class="header">
    <h2>AI Assistant</h2>
    <div class="sub">Ask questions about your order data</div>
  </div>

  <div class="messages" id="messages" role="log" aria-live="polite" aria-label="Conversation">
    <div class="msg msg-system" role="status">
      Ask me anything about orders, samples, shipments, or customers.
      I can only read data — I cannot make changes.
    </div>
    <div class="suggestions" id="suggestions" role="group" aria-label="Suggested questions">
      <button class="suggestion" onclick="askSuggestion(this)" type="button">How many orders are pending?</button>
      <button class="suggestion" onclick="askSuggestion(this)" type="button">What shipped today?</button>
      <button class="suggestion" onclick="askSuggestion(this)" type="button">Show orders from Volcafe</button>
      <button class="suggestion" onclick="askSuggestion(this)" type="button">Which warehouses have live orders?</button>
    </div>
  </div>

  <div class="input-area">
    <div class="input-row">
      <label for="questionInput" style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;">Ask a question about your orders</label>
      <textarea id="questionInput" placeholder="Ask a question..."
                rows="1" onkeydown="handleKey(event)"
                aria-label="Ask a question about your orders"></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendQuestion()" aria-label="Send question" type="button">Ask</button>
    </div>
  </div>

  <div class="footer">Read-only &bull; Powered by Claude</div>

<script>
  var busy = false;

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendQuestion();
    }
  }

  function askSuggestion(el) {
    document.getElementById('questionInput').value = el.textContent;
    sendQuestion();
  }

  function sendQuestion() {
    var input = document.getElementById('questionInput');
    var question = input.value.trim();
    if (!question || busy) return;

    busy = true;
    document.getElementById('sendBtn').disabled = true;

    // Hide suggestions after first question
    var sug = document.getElementById('suggestions');
    if (sug) sug.style.display = 'none';

    // Add user message
    addMessage(question, 'user');
    input.value = '';

    // Show loading indicator
    var loadingId = showLoading();

    google.script.run
      .withSuccessHandler(function(result) {
        removeLoading(loadingId);
        if (result.success) {
          addMessage(result.message, 'ai');
        } else {
          addMessage(result.message, 'error');
        }
        busy = false;
        document.getElementById('sendBtn').disabled = false;
        input.focus();
      })
      .withFailureHandler(function(err) {
        removeLoading(loadingId);
        addMessage('Connection error. Please try again.', 'error');
        busy = false;
        document.getElementById('sendBtn').disabled = false;
        input.focus();
      })
      .askAiAssistant(question);
  }

  function addMessage(text, type) {
    var container = document.getElementById('messages');
    var div = document.createElement('div');
    div.className = 'msg msg-' + type;

    if (type === 'ai') {
      // Safely render text with line breaks using DOM APIs
      var lines = String(text).split('\n');
      lines.forEach(function(line, idx) {
        if (idx > 0) div.appendChild(document.createElement('br'));
        div.appendChild(document.createTextNode(line));
      });
    } else {
      div.textContent = text;
    }

    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
  }

  function showLoading() {
    var container = document.getElementById('messages');
    var div = document.createElement('div');
    var id = 'loading-' + Date.now();
    div.id = id;
    div.className = 'loading';
    for (var i = 0; i < 3; i++) {
      var dot = document.createElement('div');
      dot.className = 'dot';
      div.appendChild(dot);
    }
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
    return id;
  }

  function removeLoading(id) {
    var el = document.getElementById(id);
    if (el) el.remove();
  }

  // Auto-focus input
  document.getElementById('questionInput').focus();
</script>
</body>
</html>
