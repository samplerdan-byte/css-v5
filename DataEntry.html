<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coffee Sampling - Data Entry</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f5f5f5; min-height: 100vh; }

    .header {
      background: #2E5339; color: #fff; padding: 20px; text-align: center;
    }
    .header h1 { font-size: 20px; margin-bottom: 4px; }
    .header .tagline { font-size: 12px; opacity: 0.8; font-style: italic; }

    .container { max-width: 600px; margin: 20px auto; padding: 0 15px; }

    .tabs {
      display: flex; margin-bottom: 0; background: #fff; border-radius: 8px 8px 0 0;
      overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }
    .tab {
      flex: 1; padding: 12px; text-align: center; cursor: pointer;
      font-weight: bold; font-size: 14px; border: none; background: #f0f0f0; color: #666;
    }
    .tab.active { background: #fff; color: #2E5339; border-bottom: 3px solid #2E5339; }

    .tab-content {
      background: #fff; padding: 20px; border-radius: 0 0 8px 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1); display: none;
    }
    .tab-content.active { display: block; }

    label { display: block; font-size: 12px; color: #555; margin-bottom: 3px; font-weight: bold; }
    input, select, textarea {
      width: 100%; padding: 10px; border: 1px solid #ccc;
      border-radius: 5px; font-size: 14px; margin-bottom: 12px;
    }
    input:focus, select:focus, textarea:focus {
      outline: none; border-color: #2E5339; box-shadow: 0 0 0 2px rgba(46,83,57,0.2);
    }
    textarea { resize: vertical; min-height: 120px; font-family: monospace; }

    .row { display: flex; gap: 10px; }
    .row > div { flex: 1; }

    .submit-btn {
      width: 100%; padding: 14px; background: #2E5339; color: #fff;
      border: none; border-radius: 8px; font-size: 16px; font-weight: bold;
      cursor: pointer; margin-top: 5px;
    }
    .submit-btn:hover { background: #3a6249; }
    .submit-btn:disabled { background: #ccc; }

    #statusMsg {
      padding: 12px; border-radius: 6px; text-align: center;
      font-weight: bold; margin-top: 15px; display: none;
    }
    .msg-success { background: #d4edda; color: #155724; display: block !important; }
    .msg-error { background: #f8d7da; color: #721c24; display: block !important; }

    .footer {
      text-align: center; color: #999; font-size: 11px;
      margin-top: 30px; padding-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>☕ COMMODITY SAMPLER SERVICES</h1>
    <div class="tagline">Integrity Through Independence</div>
  </div>

  <div class="container">
    <div class="tabs">
      <div class="tab active" onclick="switchTab('form')">📝 Form Entry</div>
      <div class="tab" onclick="switchTab('paste')">📋 Paste Text</div>
    </div>

    <!-- Form Entry Tab -->
    <div class="tab-content active" id="tab-form">
      <label>Customer</label>
      <input type="text" id="customer" placeholder="Company name">

      <label>Sample Order #</label>
      <input type="text" id="sampleOrderNum" placeholder="e.g. SO-12345">

      <div class="row">
        <div>
          <label>Container</label>
          <input type="text" id="container" placeholder="ABCD1234567">
        </div>
        <div>
          <label>Mark</label>
          <input type="text" id="mark" placeholder="003/0123/456">
        </div>
      </div>

      <div class="row">
        <div>
          <label>Cargo</label>
          <input type="text" id="cargo" placeholder="C123456">
        </div>
        <div>
          <label>Bag Count</label>
          <input type="text" id="bagCount" placeholder="300">
        </div>
      </div>

      <label>Description</label>
      <input type="text" id="description" placeholder="Green coffee, washed arabica...">

      <label>Reference</label>
      <input type="text" id="reference" placeholder="Optional reference number">

      <div class="row">
        <div>
          <label>Country</label>
          <input type="text" id="country" placeholder="e.g. Colombia">
        </div>
        <div>
          <label>Warehouse</label>
          <input type="text" id="warehouse" placeholder="Continental Warehouse" value="Continental Warehouse">
        </div>
      </div>

      <button class="submit-btn" id="formBtn" onclick="submitForm()">Submit Sample</button>
    </div>

    <!-- Paste Text Tab -->
    <div class="tab-content" id="tab-paste">
      <label>Paste order text below:</label>
      <textarea id="pasteText" placeholder="Paste email or order text here...&#10;&#10;Example format:&#10;Container: MSKU1234567&#10;Mark: 003/0123/00456&#10;Cargo: C123456&#10;Description: Green coffee arabica&#10;Bag Count: 300&#10;Warehouse: Continental"></textarea>
      <button class="submit-btn" id="pasteBtn" onclick="submitPaste()">Parse & Submit</button>
    </div>

    <div id="statusMsg"></div>
  </div>

  <div class="footer">
    Commodity Sampler Services | <a href="/cdn-cgi/l/email-protection" class="__cf_email__" data-cfemail="721b1c141d32111d1f1f1d161b060b01131f021e17005c111d1f">[email&#160;protected]</a> | 732-583-0666
  </div>

  <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
      document.querySelectorAll('.tab-content').forEach(function(c) { c.classList.remove('active'); });
      if (tab === 'form') {
        document.querySelectorAll('.tab')[0].classList.add('active');
        document.getElementById('tab-form').classList.add('active');
      } else {
        document.querySelectorAll('.tab')[1].classList.add('active');
        document.getElementById('tab-paste').classList.add('active');
      }
      clearStatus();
    }

    function submitForm() {
      var btn = document.getElementById('formBtn');
      btn.disabled = true;
      btn.textContent = 'Submitting...';
      clearStatus();

      var data = {
        customer: document.getElementById('customer').value.trim(),
        sampleOrderNum: document.getElementById('sampleOrderNum').value.trim(),
        container: document.getElementById('container').value.trim(),
        mark: document.getElementById('mark').value.trim(),
        cargo: document.getElementById('cargo').value.trim(),
        bagCount: document.getElementById('bagCount').value.trim(),
        description: document.getElementById('description').value.trim(),
        reference: document.getElementById('reference').value.trim(),
        country: document.getElementById('country').value.trim(),
        warehouse: document.getElementById('warehouse').value.trim()
      };

      google.script.run
        .withSuccessHandler(function(result) {
          btn.disabled = false;
          btn.textContent = 'Submit Sample';
          showStatus(result.success ? 'msg-success' : 'msg-error', result.message);
          if (result.success) clearForm();
        })
        .withFailureHandler(function(err) {
          btn.disabled = false;
          btn.textContent = 'Submit Sample';
          showStatus('msg-error', '❌ Error: ' + err.message);
        })
        .processManualEntry(data);
    }

    function submitPaste() {
      var btn = document.getElementById('pasteBtn');
      var text = document.getElementById('pasteText').value.trim();
      if (!text) { showStatus('msg-error', 'Please paste some text first.'); return; }

      btn.disabled = true;
      btn.textContent = 'Parsing...';
      clearStatus();

      google.script.run
        .withSuccessHandler(function(result) {
          btn.disabled = false;
          btn.textContent = 'Parse & Submit';
          showStatus(result.success ? 'msg-success' : 'msg-error', result.message);
          if (result.success) document.getElementById('pasteText').value = '';
        })
        .withFailureHandler(function(err) {
          btn.disabled = false;
          btn.textContent = 'Parse & Submit';
          showStatus('msg-error', '❌ Error: ' + err.message);
        })
        .processPastedText(text);
    }

    function clearForm() {
      ['customer','sampleOrderNum','container','mark','cargo','bagCount',
       'description','reference','country'].forEach(function(id) {
        document.getElementById(id).value = '';
      });
    }

      el.clas
